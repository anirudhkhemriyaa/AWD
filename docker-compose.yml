version: '3.9'

services:

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - backend
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
  web:
    build: .
    command: gunicorn awd_main.wsgi:application --bind 0.0.0.0:8000
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - media_data:/app/media
    networks:
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"

  celery:
    build: .
    command: celery -A awd_main worker --loglevel=info
    env_file:
      - .env
    depends_on:
      - redis
      - db
    volumes:
      - media_data:/app/media
    networks:
      - backend
    extra_hosts:
    - "host.docker.internal:host-gateway"

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    ports:
      - "80:80"
    depends_on:
      - web
    networks:
      - backend

volumes:
  postgres_data:
  media_data:

networks:
  backend:
