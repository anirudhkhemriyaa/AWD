<style>
.messages {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.alert {
    display: flex;
    align-items: center;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 500;
    border: 1px solid;
    margin: 0;
}

/* Success */
.alert-success {
    background: #f0fdf4;
    color: #166534;
    border-color: #bbf7d0;
}

/* Error / Danger */
.alert-error,
.alert-danger {
    background: #fef2f2;
    color: #991b1b;
    border-color: #fecaca;
}

/* Warning */
.alert-warning {
    background: #fffbeb;
    color: #92400e;
    border-color: #fde68a;
}

/* Info */
.alert-info {
    background: #eff6ff;
    color: #1d4ed8;
    border-color: #bfdbfe;
}
</style>

{% if messages %}
<div class="messages" id="msg">
    {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">
            {{ message }}
        </div>
    {% endfor %}
</div>

<script>
setTimeout(() => {
    const msg = document.getElementById("msg");
    if (msg) {
        msg.style.transition = "opacity .3s ease";
        msg.style.opacity = "0";
        setTimeout(() => msg.remove(), 300);
    }
}, 4000);
</script>

{% endif %}
