
<style>/* Base alert */
.alert {
  padding: 12px 16px;
  border-radius: 6px;
  margin-bottom: 12px;
  font-weight: 500;
}

/* Error / danger */
.alert-error,
.alert-danger {
  background-color: #3a1212; /* dark red */
  color: #ffd2d2;            /* light text */
  border: 1px solid #ff5c5c;
}

/* Success */
.alert-success {
  background-color: #0f2f1f;
  color: #b2ffd8;
  border: 1px solid #3aff9b;
}

/* Info */
.alert-info {
  background-color: #102a3a;
  color: #9fd9ff;
  border: 1px solid #4ab3ff;
}
</style>


{% if messages %}
<div class="messages"  id="msg">
    {% for message in messages %}
    <div{% if message.tags %} class=" alert alert-{{ message.tags }}"{% endif %}>{{ message }}</div>
    {% endfor %}
</div>
{% endif %}
