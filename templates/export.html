{% extends "layout.html" %}
{% load static %}

{% block title %}Export Data | MyApp{% endblock %}

{% block content %}

<h2 class="fw-bold mb-4 text-center">Export Data to CSV</h2>

<div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-body">

        <form action="{% url 'export' %}" method="post">
            {% csrf_token %}

            <div class="mb-3">
                <label for="model_name" class="form-label fw-semibold">Select Model</label>
                <select id="model_name" name="model_name" class="form-select" required>
                    <option value="" disabled selected>Select model</option>
                    {% for model in models %}
                        <option value="{{ model }}">{{ model }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-success w-100">Export</button>

            <div class="mt-3">
                {% include 'alerts.html' %}
            </div>
        </form>

    </div>
</div>

{% endblock %}
