{% extends "layout.html" %}

{% block title %}Import Data | MyApp{% endblock %}

{% block content %}

<h2 class="fw-bold mb-4 text-center">Import Data to Database</h2>

<div class="card shadow-sm mx-auto" style="max-width: 600px;">
    <div class="card-body">

        <form action="{% url 'home' %}" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="mb-3">
                <label for="file_name" class="form-label fw-semibold">Upload CSV File</label>
                <input type="file" id="file_name" name="file_name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label for="model_name" class="form-label fw-semibold">Select Model</label>
                <select id="model_name" name="model_name" class="form-select" required>
                    <option value="" disabled selected>Select model</option>
                    {% for model in models %}
                        <option value="{{ model }}">{{ model }}</option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary w-100">Submit</button>

            <div class="mt-3">
                {% include "alerts.html" %}
            </div>

        </form>

    </div>
</div>

{% endblock %}
