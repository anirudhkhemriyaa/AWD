{% extends "layout.html" %}
{% block title %}Import Data | MyApp{% endblock %}

{% block content %}

<div class="text-center mb-5">
    <h2 class="fw-semibold">Import Data</h2>
    <p class="text-secondary">
        Upload a CSV file and map it to a database model.
    </p>
</div>

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card bg-dark border border-secondary rounded-4">
            <div class="card-body p-4">

                <form action="{% url 'home' %}" method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="mb-4">
                        <label class="form-label text-light fw-medium">
                            CSV File
                        </label>
                        <input type="file" class="form-control bg-dark text-light border-secondary" name="file_name" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label text-light fw-medium">
                            Target Model
                        </label>
                        <select class="form-select bg-dark text-light border-secondary" required name="model_name">
                            <option disabled selected class="text-secondary">
                                Select a model
                            </option>
                            {% for model in models %}
                                <option value="{{ model }}">{{ model }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <button class="btn btn-info text-dark w-100 fw-medium">
                        Import Data
                    </button>

                    <div class="mt-4">
                        {% include "alerts.html" %}
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
