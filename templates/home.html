<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Import</title>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
</head>
<body>
  <div class="container">
    <h3>Import data to db tables</h3>

    <form action="{% url 'home' %}" method="post" enctype="multipart/form-data">
      {% csrf_token %}

      <div class="form-group">
        <label for="file_name">Upload CSV file</label>
        <input type="file" id="file_name" name="file_name" class="form-control" required>
      </div>

      <div class="form-group">
        <label for="model_name">Select model name</label>
        <select id="model_name" name="model_name" class="form-control" required>
          <option value="" disabled selected>Select</option>
          {% for model in models %}
            <option value="{{ model }}">{{ model }}</option>
          {% endfor %}
        </select>
      </div>

      <input type="submit" value="Submit" class="btn btn-primary">

      {% include 'alerts.html' %}
    </form>
  </div>
</body>
</html>
