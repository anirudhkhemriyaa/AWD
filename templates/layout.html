{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>{% block title %}AWM{% endblock %}</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

:root{

--bg:#fafafa;
--surface:#ffffff;
--border:#e5e7eb;
--text:#111827;
--muted:#6b7280;
--black:#111111;

}

*{
font-family:Inter,sans-serif;
}

body{
background:var(--bg);
color:var(--text);
font-size:15px;
}

a{
text-decoration:none;
}

.navbar{
background:#fff;
border-bottom:1px solid var(--border);
height:72px;
}

.navbar-brand{
font-weight:700;
font-size:22px;
letter-spacing:-0.5px;
color:var(--text);
}

.badge-dashboard{
background:#f3f4f6;
color:#374151;
font-weight:500;
font-size:12px;
padding:.45rem .7rem;
border-radius:999px;
}

.nav-link{
color:#6b7280;
font-weight:500;
padding:.4rem .2rem;
margin:0 .8rem;
transition:.2s;
}

.nav-link:hover{
color:#111;
}

.nav-link.active{
color:#111;
font-weight:600;
}

.btn-black{
background:#111;
color:white;
border:none;
padding:.6rem 1.2rem;
font-weight:500;
}

.btn-black:hover{
background:#000;
color:white;
}

.btn-outline-dark{
border:1px solid var(--border);
}

.card{
background:white;
border:1px solid var(--border);
border-radius:14px;
box-shadow:none;
}

.form-control,
.form-select{

height:48px;
border:1px solid var(--border);

}

.form-control:focus,
.form-select:focus{

box-shadow:none;
border-color:#111;

}

.form-label{
font-weight:600;
margin-bottom:.55rem;
}

.table{

margin:0;

}

.table th{

font-weight:600;
background:#f9fafb;

}

.table td,
.table th{

padding:14px;

}

.section-title{

font-size:32px;
font-weight:700;
letter-spacing:-1px;

}

.section-subtitle{

color:var(--muted);

}

.small-muted{

color:var(--muted);
font-size:14px;

}

hr{
opacity:1;
border-color:var(--border);
}

main{

padding-top:60px;
padding-bottom:60px;

}

</style>

</head>

<body>

<nav class="navbar navbar-expand-lg">

<div class="container">

<a href="{% url 'base' %}" class="navbar-brand">

AWM

</a>

<span class="badge-dashboard ms-2">

Dashboard

</span>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav">

<span class="navbar-toggler-icon"></span>

</button>

<div class="collapse navbar-collapse" id="nav">

<ul class="navbar-nav mx-auto">

<li class="nav-item">

<a href="{% url 'base' %}" class="nav-link">Home</a>

</li>

<li class="nav-item">

<a href="{% url 'home' %}" class="nav-link">Import</a>

</li>

<li class="nav-item">

<a href="{% url 'export' %}" class="nav-link">Export</a>

</li>

<li class="nav-item">

<a href="{% url 'send_email' %}" class="nav-link">Emails</a>

</li>

<li class="nav-item">

<a href="{% url 'track_dashboard' %}" class="nav-link">Tracking</a>

</li>

</ul>

<div class="d-flex align-items-center gap-2">

{% if user.is_authenticated %}

<span class="small text-secondary">

{{ user.username }}

</span>

<a href="{% url 'profile' %}" class="btn btn-outline-dark">

Profile

</a>

<a href="{% url 'logout' %}" class="btn btn-black">

Logout

</a>

{% else %}

<a href="{% url 'login' %}" class="btn btn-outline-dark">

Login

</a>

<a href="{% url 'register' %}" class="btn btn-black">

Register

</a>

{% endif %}

</div>

</div>

</div>

</nav>

<main class="container">

{% block content %}

{% endblock %}

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
