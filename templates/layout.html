{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AWM{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0e1117;
            --bg-surface: #161b22;
            --border-subtle: #222836;
            --text-main: #e6edf3;
            --text-muted: #9aa4b2;
            --accent: #4f8cff;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
        }

        /* Navbar */
        .navbar {
            background: transparent;
            border-bottom: 1px solid var(--border-subtle);
        }

        .navbar-brand {
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        /* Cards */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            transition: all 0.25s ease;
        }

        .card-title {
            color: var(--text-main);
            font-weight: 600;
        }

        .card-text {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }

        /* Buttons */
        .btn-accent {
            background: var(--accent);
            border: none;
            color: #fff;
            font-weight: 500;
        }

        .btn-accent:hover {
            opacity: 0.9;
            color: #fff;
        }

        /* Small detail: subtle divider */
        .soft-divider {
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                var(--border-subtle),
                transparent
            );
            margin: 3rem 0;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg">
    <div class="container">
        <a class="navbar-brand" href="#">AWM</a>

        <div class="ms-auto">
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}" class="btn btn-secondary btn-sm  me-2">Profile</a>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-outline-light">Logout</a>
            {% else %}
                <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light me-2">Login</a>
                <a href="{% url 'register' %}" class="btn btn-sm btn-accent">Register</a>
            {% endif %}
        </div>
    </div>
</nav>

<main class="container py-5">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
