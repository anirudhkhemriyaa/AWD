{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}AWM{% endblock %}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        :root {
            --bg-main: #0e1117;
            --bg-surface: #161b22;
            --border-subtle: #222836;
            --text-main: #e6edf3;
            --text-muted: #9aa4b2;
            --accent: #4f8cff;
        }

        body {
            background: var(--bg-main);
            color: var(--text-main);
        }

        /* Navbar */
        .navbar {
            background: transparent;
            border-bottom: 1px solid var(--border-subtle);
        }

        .navbar-brand {
            color: var(--text-main);
            font-weight: 600;
            letter-spacing: 0.4px;
        }

        /* Cards */
        .card {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            border-radius: 14px;
            transition: all 0.25s ease;
        }

        .card-title {
            color: var(--text-main);
            font-weight: 600;
        }

        .card-text {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .card:hover {
            transform: translateY(-6px);
            border-color: var(--accent);
        }

        /* Buttons */
        .btn-accent {
            background: var(--accent);
            border: none;
            color: #fff;
            font-weight: 500;
        }

        .btn-accent:hover {
            opacity: 0.9;
            color: #fff;
        }

        /* Small detail: subtle divider */
        .soft-divider {
            height: 1px;
            background: linear-gradient(
                to right,
                transparent,
                var(--border-subtle),
                transparent
            );
            margin: 3rem 0;
        }

        .navbar .nav-link {
        position: relative;
        transition: color 0.2s ease;
        }

        .navbar .nav-link:hover {
            color: var(--text-main);
        }

        .navbar .nav-link.active::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -6px;
            width: 100%;
            height: 2px;
            background: var(--accent);
            border-radius: 2px;
        }

    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg py-3">
    <div class="container">

        <!-- Brand -->
        <p class="navbar-brand d-flex align-items-center gap-2" >
            <span class="fw-bold">AWM</span>
            <span class="badge rounded-pill text-bg-secondary small">Dashboard</span>
        </p>

        <!-- Toggler -->
        <button class="navbar-toggler border-0 text-light" type="button"
                data-bs-toggle="collapse" data-bs-target="#mainNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Links -->
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav mx-auto gap-3 small">
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'base' %}">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'home' %}">Import</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'export' %}">Export</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'send_email' %}">Emails</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link text-light" href="{% url 'track_dashboard' %}">Tracking</a>
                </li>
            </ul>

            <!-- Right side -->
            <div class="d-flex align-items-center gap-2">
                {% if user.is_authenticated %}
                    <span class="small text-light me-2">
                        {{ user.username }}
                    </span>
                    <a href="{% url 'profile' %}" class="btn btn-sm btn-outline-light">
                        Profile
                    </a>
                    <a href="{% url 'logout' %}" class="btn btn-sm btn-accent">
                        Logout
                    </a>
                {% else %}
                    <a href="{% url 'login' %}" class="btn btn-sm btn-outline-light">
                        Login
                    </a>
                    <a href="{% url 'register' %}" class="btn btn-sm btn-accent">
                        Register
                    </a>
                {% endif %}
            </div>
        </div>

    </div>
</nav>


<main class="container py-5">
    {% block content %}{% endblock %}
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
