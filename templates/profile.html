{% extends "base.html" %}

{% block title %}Profile | MyApp{% endblock %}

{% block content %}

<div class="container">
<div class="d-flex justify-content-end gap-2">
    <a href="{% url 'base' %}" class="btn btn-outline-light btn-sm">
        Dashboard
    </a>
</div>

    <div class="text-center mb-5">
        <h2 class="fw-semibold text-light">Profile</h2>
        <p class="text-secondary small">
            Account information
        </p>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">

            <div class="card bg-dark border border-secondary rounded-4">
                <div class="card-body p-4">

                    <!-- Username -->
                    <div class="mb-4">
                        <div class="text-secondary small">
                            Username
                        </div>
                        <div class="fw-medium text-white">
                            {{ request.user.username }}
                        </div>
                    </div>

                    <!-- Email -->
                    <div class="mb-4">
                        <div class="text-secondary small">
                            Email
                        </div>
                        <div class="fw-medium text-white">
                            {{ request.user.email }}
                        </div>
                    </div>

                    <hr class="border-secondary">

                    <!-- Actions (future-safe) -->
                    <div class="d-flex justify-content-end gap-2">
                        <a href="#" class="btn btn-outline-light btn-sm">
                            Edit Profile
                        </a>
                        <a href="{% url 'logout' %}" class="btn btn-danger btn-sm">
                            Logout
                        </a>
                    </div>

                </div>
            </div>

        </div>
    </div>

</div>

{% endblock %}
